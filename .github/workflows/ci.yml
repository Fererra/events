name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (format, lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint (incl. module boundaries)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Coverage", "| Metric | % | Covered |", "|---|---|---|",
                ...["lines", "statements", "branches", "functions"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: npm run build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s/^JWT_ACCESS_SECRET=.*/JWT_ACCESS_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^JWT_REFRESH_SECRET=.*/JWT_REFRESH_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^HTTPS_PORT=.*/HTTPS_PORT=8443/" .env

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build and start web + app + postgres
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test through nginx (HTTPS → /api → app → postgres)
        run: |
          curl -fsSk https://localhost:8443/ | grep -q "Event Service"
          curl -fsSk https://localhost:8443/api/health | grep -q '"ok"'
          curl -fsSk https://localhost:8443/api/health/db | grep -q '"ok"'
          # Registration hits the real PostgreSQL with applied migrations.
          code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost:8443/api/auth/register \
            -H 'content-type: application/json' -d '{"surname":"CI","name":"Runner","phone":"+380501234567","email":"ci@example.com","password":"ci-password"}')
          test "$code" = "201"
          # Bootstrap admin from .env can log in.
          curl -fsSk -X POST https://localhost:8443/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"change-me-admin"}' | grep -q accessToken

      - name: Only port 443 (8443 on the host) is published
        run: |
          docker compose ps --format '{{.Service}} {{.Ports}}'
          # Every published mapping ("host->container") must target container port 443.
          published=$(docker compose ps --format '{{.Ports}}' | grep -o -- '->[0-9]*/tcp' | sort -u)
          echo "published: $published"
          test "$published" = "->443/tcp"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
