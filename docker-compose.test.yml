name: event-service-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-events}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-events}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-events_test}
    ports:
      - '${TEST_POSTGRES_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 2s
      retries: 15
